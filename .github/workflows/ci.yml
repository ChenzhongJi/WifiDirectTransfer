name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WifiDirectTransfer.sln

      - name: Build
        run: dotnet build WifiDirectTransfer.sln -c Release --no-restore

      - name: Test
        run: dotnet test WifiDirectTransfer.sln -c Release --no-build
